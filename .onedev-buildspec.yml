version: 59
jobs:
- name: Build & Package Release Tarball
  executeInSandbox: false
  jobExecutor: Builder
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Extract Version
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        echo "Extracting version from package.json..."
        grep -oP '"version":\s*"\K[^"]+' package.json > version.txt || echo "1.0.0" > version.txt
        echo "Version extracted: $(cat version.txt)"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Build and Package Release Tarball
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        VERSION=$(cat version.txt)
        PKG_NAME="controlcenter-web"
        BUILD_DIR="package_build"
        RELEASE_DIR="release"

        echo "Installing dependencies..."
        npm install

        echo "Building Nuxt application..."
        npm run build

        echo "Pruning devDependencies..."
        npm prune --omit=dev

        echo "Assembling package structure..."
        rm -rf "$BUILD_DIR" "$RELEASE_DIR"
        mkdir -p "$BUILD_DIR" "$RELEASE_DIR"

        # Copy .output contents, installer script, and start script
        cp -r .output/* "$BUILD_DIR/"
        cp package.json "$BUILD_DIR/"
        if [ -f install-service.sh ]; then
          cp install-service.sh "$BUILD_DIR/"
          chmod +x "$BUILD_DIR/install-service.sh"
        fi
        if [ -f start.sh ]; then
          cp start.sh "$BUILD_DIR/"
          chmod +x "$BUILD_DIR/start.sh"
        fi

        # Replace symlinked/bundled server/node_modules with real production node_modules
        rm -rf "$BUILD_DIR/server/node_modules"
        cp -r node_modules "$BUILD_DIR/server/"
        cp package.json "$BUILD_DIR/server/"

        echo "Compressing release tarball..."
        TARBALL_NAME="${PKG_NAME}-${VERSION}.tar.gz"
        (cd "$BUILD_DIR" && tar -czvf "../${RELEASE_DIR}/${TARBALL_NAME}" .)

        echo "Package created: ${RELEASE_DIR}/${TARBALL_NAME}"
        rm -rf "$BUILD_DIR"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@file:version.txt@'
    condition: ALWAYS
    optional: false
  - type: PublishArtifactStep
    name: Upload Artifacts
    sourcePath: release
    artifacts: '**'
    condition: ALWAYS
    optional: false
  - type: CommandStep
    name: check if tag exists
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        version=$(cat version.txt)
        echo "Checking if tag '$version' exists on origin..."

        if git ls-remote --tags origin | grep -q "refs/tags/${version}$"; then
            echo "Tag '$version' already exists."
            exit 1
        else
            echo "Tag '$version' does not exist. Proceeding to create tag."
            exit 0
        fi
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CreateTagStep
    name: create tag
    tagName: '@file:version.txt@'
    tagMessage: Release @file:version.txt@
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
- name: Release Stable AUR
  executeInSandbox: false
  jobExecutor: Builder
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: set build version
    buildVersion: '@tag@'
    condition: ALWAYS
    optional: false
  - type: CommandStep
    name: Update Stable AUR Package
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        repo_url="ssh://aur@@aur.archlinux.org/controlcenter.git"
        repo_dir="controlcenter"

        git clone "$repo_url"

        version=@tag@

        sed -i "s/^pkgver=.*/pkgver=${version}/" "$repo_dir/PKGBUILD"

        (
          cd "$repo_dir" || exit 1
          makepkg --printsrcinfo > .SRCINFO
          git add PKGBUILD .SRCINFO
          git commit -m "Automatically updated version to ${version}"
          git push
        )
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: TagCreateTrigger
    branches: master
    projects: ControlCenter
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
